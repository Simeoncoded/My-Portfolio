<section id="contact" class="contact-section" aria-labelledby="contact-title">
    <div class="contact-wrap">
      <h2 id="contact-title" class="contact-title">Let’s Connect</h2>
  
      <p *ngIf="sent()" class="success-banner" role="status">Thanks! Your message was sent.</p>
      <p *ngIf="error()" class="error-banner" role="alert">{{ error() }}</p>
  
      <form class="contact-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" formControlName="name" type="text"
                 placeholder="Your name" autocomplete="name" [disabled]="sending()" required>
        </div>
  
        <div class="field">
          <label for="email">Email</label>
          <input id="email" formControlName="email" type="email"
                 placeholder="you@example.com" autocomplete="email" [disabled]="sending()" required>
        </div>
  
        <div class="field full">
          <label for="message">Message</label>
          <textarea id="message" formControlName="message" rows="6"
                    placeholder="Your message…" [disabled]="sending()" required></textarea>
        </div>
  
        <!-- Honeypot (spam trap) -->
        <input type="text" formControlName="_honeypot" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  
        <div class="actions">
          <button type="submit" class="btn btn-primary" [disabled]="sending()">
            {{ sending() ? 'Sending…' : 'Send' }}
          </button>
          <span class="form-status" aria-live="polite"></span>
        </div>
      </form>
    </div>
  </section>
